          type="button"
          class="nav-toggle"
          id="nav-toggle"
          aria-expanded="false"
          aria-controls="mobile-menu"
          aria-label="開啟選單"
        >
          <svg id="icon-menu" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>

          <svg id="icon-close" hidden xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

          <a href="index.html">首頁</a>
          <a href="services.html">服務項目</a>
          <a href="about.html">關於我們</a>
          <a href="clients.html">合作品牌</a>

        </div>

    </header>

    <main>
      <!-- Page Hero -->
      <section class="page-hero" aria-label="聯絡我們主視覺">
        <div class="hero-bg">
          <img src="src/imports/1-電腦1600x640-01-300x120.jpg" alt="" />
          <div class="hero-overlay"></div>
        </div>
        <div class="hero-glow" id="hero-glow" aria-hidden="true"></div>
        <div class="page-hero-content">
          <p class="breadcrumb"><a href="index.html">‹ 返回首頁</a></p>
          <h1 class="page-hero-title">
            聯絡<span class="gold">我們</span>
          </h1>
          <p class="page-hero-subtitle">
            歡迎填寫聯絡表單，我們將盡快為您服務
          </p>
        </div>
      </section>

      <!-- 聯絡方式 -->
      <section class="section section--compact-top" aria-label="聯絡方式">
        <div class="container" style="max-width: 56rem">
          <div class="contact-links" data-animate="fade-up" data-delay="0.1">
            <a href="mailto:a6355235@enjoymktg.com" class="contact-link">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              a6355235@enjoymktg.com
            </a>
            <a href="https://facebook.com/enjoymarketing" target="_blank" rel="noopener noreferrer" class="contact-link">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
              Facebook
            </a>
            <a href="https://instagram.com/enjoymktg" target="_blank" rel="noopener noreferrer" class="contact-link">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
              Instagram
            </a>
          </div>
        </div>
      </section>

      <!-- 聯絡表單 -->
      <section class="section section--compact-top" aria-labelledby="contact-title">
        <div class="container" style="max-width: 56rem">
          <h2 id="contact-title" class="section-title" data-animate="fade-up" style="margin-bottom: 2rem">
            聯繫<span class="gold">我們</span>
          </h2>
          <p class="section-desc" data-animate="fade-up" data-delay="0.2" style="margin-top: 0; margin-bottom: 4rem">
            讓我們一起創造卓越成果
          </p>

          <div class="contact-box" data-animate="fade-up" data-delay="0.3">
            <span class="form-glow" aria-hidden="true"></span>
            <span class="form-glow form-glow--bl" aria-hidden="true"></span>
            <form id="contact-form" class="contact-form" action="#" method="post">
              <div class="form-grid">
                <div class="form-group" data-animate="fade-left" data-delay="0.4">
                  <label for="name">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    姓名
                  </label>
                  <div class="form-input-wrap">
                    <input type="text" id="name" name="name" placeholder="請輸入您的姓名" required />
                  </div>
                </div>
                <div class="form-group" data-animate="fade-right" data-delay="0.4">
                  <label for="email">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                    Email
                  </label>
                  <div class="form-input-wrap">
                    <input type="email" id="email" name="email" placeholder="請輸入您的 Email" required />
                  </div>
                </div>
              </div>
              <div class="form-grid">
                <div class="form-group" data-animate="fade-left" data-delay="0.5">
                  <label for="phone">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                    電話號碼
                  </label>
                  <div class="form-input-wrap">
                    <input type="tel" id="phone" name="phone" placeholder="請輸入您的電話號碼" />
                  </div>
                </div>
                <div class="form-group" data-animate="fade-right" data-delay="0.5">
                  <label for="company">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>
                    公司名稱
                  </label>
                  <div class="form-input-wrap">
                    <input type="text" id="company" name="company" placeholder="請輸入您的公司名稱" />
                  </div>
                </div>
              </div>
              <div class="form-group" data-animate="fade-up" data-delay="0.6">
                <label for="message">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                  訊息
                </label>
                <div class="form-input-wrap">
                  <textarea id="message" name="message" rows="6" placeholder="請輸入您的訊息內容"></textarea>
                </div>
              </div>
              <div class="btn-center" style="margin-top: 0" data-animate="fade-up" data-delay="0.7">
                <button type="submit" class="btn-gold"><span>送出</span></button>
              </div>
            </form>
          </div>
          <div class="section-divider" data-animate="line-x" data-delay="0.5"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container" data-animate="fade-in">
        <img src="src/imports/logo.png" alt="Logo" />
        <p>© 2026 All rights reserved. | 享受創意整合行銷</p>
      </div>
    </footer>

    <script src="assets/js/main.js" defer></script>
  </body>
</html>
